name: Deploy Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Docs & Version Aliases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv toolchain
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --all-groups --all-extras

      - name: Configure Git User & Fetch gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true

      - name: Build & Deploy Branch (dev)
        if: github.ref == 'refs/heads/main'
        run: |
          uv run mike deploy --push --update-aliases dev

      - name: Build & Deploy Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          if [[ "$TAG_NAME" =~ [a-zA-Z] ]]; then
            echo "Deploying pre-release ${TAG_NAME} to 'dev' alias..."
            uv run mike deploy --push --update-aliases dev
          else
            echo "Deploying stable release ${TAG_NAME} to 'latest' alias..."
            uv run mike deploy --push --update-aliases $TAG_NAME latest
            uv run mike set-default --push latest
          fi

      - name: Build static site artifact for GitHub Pages
        run: |
          uv run properdocs build --site-dir site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
