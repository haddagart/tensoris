<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <!-- Vibrant Indigo/Violet/Rose Tensor Gradient -->
    <linearGradient id="tensoris-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="tensoris-grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    
    <!-- Universal Contrast Drop Shadow -->
    <filter id="universal-contrast" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- High-Contrast Vector Tensor Prism Emblem -->
  <g transform="translate(10, 10)">
    <!-- Connection Lines -->
    <path d="M 40 15 L 70 35 L 55 75 L 25 75 L 10 35 Z" fill="none" stroke="url(#tensoris-grad-primary)" stroke-width="3" stroke-opacity="0.9" />
    <path d="M 40 15 L 55 75 M 70 35 L 25 75 M 10 35 L 55 75" fill="none" stroke="url(#tensoris-grad-cyan)" stroke-width="2.2" stroke-opacity="0.9" />
    <path d="M 40 42 L 40 15 M 40 42 L 70 35 M 40 42 L 55 75 M 40 42 L 25 75 M 40 42 L 10 35" fill="none" stroke="#6366F1" stroke-width="2" stroke-opacity="0.75" />

    <!-- Nodes with High Visibility -->
    <circle cx="40" cy="15" r="5.5" fill="#6366F1" filter="url(#universal-contrast)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="70" cy="35" r="5.5" fill="#8B5CF6" filter="url(#universal-contrast)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="55" cy="75" r="5.5" fill="#EC4899" filter="url(#universal-contrast)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="25" cy="75" r="5.5" fill="#06B6D4" filter="url(#universal-contrast)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="10" cy="35" r="5.5" fill="#3B82F6" filter="url(#universal-contrast)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="40" cy="42" r="6.5" fill="#F43F5E" filter="url(#universal-contrast)" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- Typography: Tensoris -->
  <text x="100" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="1.5" fill="url(#tensoris-grad-primary)" filter="url(#universal-contrast)">
    TENSORIS
  </text>
  <text x="101" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" letter-spacing="2.5" fill="#64748B" filter="url(#universal-contrast)">
    PRODUCTION-GRADE PYTORCH FRAMEWORK
  </text>
</svg>
