# Default Experiment Configuration Schema

project:
  name: "dl-boilerplate-experiment"
  seed: 42

model:
  architecture: "resnet18"
  pretrained: true
  num_classes: 10
  dropout: 0.1

data:
  dataset_name: "cifar10"
  data_dir: "inputs/datasets/"
  batch_size: 64
  num_workers: 4

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  mixed_precision: true

logging:
  output_dir: "outputs/artifacts/"
  checkpoint_dir: "outputs/weights/"
  log_dir: "logs/"
  save_frequency: 2
